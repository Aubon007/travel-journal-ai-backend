services:
  - type: web
    name: travel-journal-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JOURNAL_CLIENT_TOKEN
        generateValue: true
